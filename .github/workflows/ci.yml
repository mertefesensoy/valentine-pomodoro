# Quality gate for every push and pull request.
# Typecheck, lint (errors fail; warnings are reported) and unit tests must pass.
# On pull requests, Reassure compares render counts and times against the base
# branch and uploads the report; it informs review rather than failing the build.

name: CI

on:
  push:
    branches: [master, 'rehaul/**', 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx jest --ci
      - name: Contrast check (every theme's declared text and mark pairs)
        # Blocking: a theme that fails its 4.5:1 / 3:1 floors does not ship (DESIGN.md,
        # the Contrast Gate Rule; NFR-A11Y-001). Needs Node 22.6+ for type stripping.
        run: npm run check:contrast
      - name: Docs check (links, IDs, backlinks, traceability)
        # Non-blocking while the Phase 1 Stage B sessions are still writing docs
        # (docs/implementations/2026-10-30-documentation-system.md §5). Make it blocking after.
        continue-on-error: true
        run: node scripts/docs/check-docs.mjs

  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Baseline on base branch
        run: |
          git switch --detach origin/${{ github.base_ref }}
          npm ci
          npx reassure --baseline || echo "No perf tests on the base branch yet"
      - name: Measure this branch
        run: |
          git switch --detach ${{ github.sha }}
          npm ci
          npx reassure --branch
      - uses: actions/upload-artifact@v4
        with:
          name: reassure-report
          path: .reassure/output.md
          if-no-files-found: ignore
