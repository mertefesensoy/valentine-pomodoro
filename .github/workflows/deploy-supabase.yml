# Applies merged database changes and Edge Functions to the hosted Supabase project (the owner's choice,
# 2026-11-05: "GitHub deploys on merge"; docs/implementations/2026-11-05-phase2-deploy.md). It runs only
# on master, after a pull request's checks have passed, and pull requests from forks can't read its
# secrets. To deploy again without a merge, run it from the Actions tab.
name: Deploy Supabase

on:
  push:
    branches: [master]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: mwftolngrxmmcbwpbaut
      # GitHub's runners have no IPv6, and the database's direct address is IPv6 only, so migrations go
      # through the session pooler, which has IPv4. The host isn't secret.
      POOLER_HOST: aws-1-eu-central-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Apply new migrations
        run: |
          # The password goes into a URL, so it's percent-encoded, and the encoded form is masked too.
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')
          echo "::add-mask::$password"
          supabase db push --db-url "postgresql://postgres.$PROJECT_REF:$password@$POOLER_HOST:5432/postgres"
      - name: Deploy the Edge Function
        run: supabase functions deploy delete-account --project-ref "$PROJECT_REF"
