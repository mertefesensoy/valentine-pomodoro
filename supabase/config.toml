# Local setup for CI and `supabase` commands (Phase 2 B1). The hosted project is configured in its
# dashboard; this file only has to describe the same Postgres, and the sign-in rules.
project_id = "valentine-pomodoro"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# The hosted project reports Postgres 17.
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
enable_signup = true
# ADR-0049: an account only at pairing, with Sign in with Apple only.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[edge_runtime]
enabled = true
policy = "oneshot"
deno_version = 2
